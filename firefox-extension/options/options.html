<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SimplyApply Autofill — Options</title>
<style>
  body {
    max-width: 480px;
    font: 14px/1.4 -apple-system, system-ui, sans-serif;
    color: #1a1a1a;
    padding: 16px;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 8px;
  }
  p.hint {
    color: #555;
    margin: 0 0 16px;
  }
  label {
    display: block;
    font-weight: 600;
    margin: 8px 0 2px;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    padding: 6px 8px;
    border: 1px solid #999;
    border-radius: 4px;
  }
  button {
    margin-top: 12px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 600;
    border: 1px solid #1a1a1a;
    border-radius: 4px;
    background: #1a1a1a;
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid #1e6fd9;
    outline-offset: 1px;
  }
  .status {
    margin-top: 10px;
    font-size: 13px;
    color: #1a7a2e;
  }
</style>
</head>
<body>
  <h1>SimplyApply Autofill — Options</h1>
  <p class="hint">
    Paste the token printed by the backend on startup (its terminal/log
    output shows it once). The extension sends it as
    <code>X-SimplyApply-Token</code> on every request so the backend knows
    it's really this extension talking to it.
  </p>

  <form id="options-form">
    <label for="api-token">Extension token</label>
    <input type="text" id="api-token" name="api-token" autocomplete="off" spellcheck="false" />
    <button type="submit">Save</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <script src="options.js"></script>
</body>
</html>
